<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO SOLL’S KLINGEN – Soundcheck</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#172331;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:36px auto;padding:18px}.panel{background:white;border-radius:20px;padding:clamp(22px,5vw,42px);box-shadow:0 10px 40px #122a4420}h1{font-size:clamp(27px,5vw,38px);margin:0}h2{font-size:25px}p,li{line-height:1.55}.muted{color:#607080}.brand{font-size:12px;font-weight:800;letter-spacing:2px;color:#176b80}.progress{height:8px;background:#e5edf0;border-radius:8px;overflow:hidden}.bar{height:100%;background:#147e92;transition:width .2s}.question{border-bottom:1px solid #e8edf0;padding:12px 0}.note{padding:16px;background:#eef7f8;border-left:4px solid #147e92;border-radius:8px;margin:20px 0}.choices{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 22px}.choices label{border:1px solid #c9d6dc;padding:10px 14px;border-radius:10px;cursor:pointer}.choices label:has(input:checked){border-color:#147e92;background:#e7f4f6}input[type=text]{width:100%;padding:14px;border:1px solid #bbcbd4;border-radius:10px;font:inherit;margin:7px 0 17px}button{padding:13px 19px;border:0;border-radius:10px;background:#116f84;color:white;font-weight:700;cursor:pointer}button.secondary{background:#e6edf1;color:#172331}button:disabled{opacity:.4;cursor:not-allowed}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.small{font-size:13px}.result{border:1px solid #e1e9ed;border-radius:10px;padding:12px;margin:8px 0}.tag{font-weight:700;color:#176b80}.hide{display:none}@media print{body{background:white}.wrap{margin:0;max-width:none}.panel{box-shadow:none;padding:0}button,.no-print{display:none!important}.result{break-inside:avoid}}</style></head><body><main class="wrap"><div class="panel"><div class="brand">SO SOLL’S KLINGEN</div><div id="app"></div></div></main><script>
const topics=[
['Workflow – habe ich mein Mischpult im Griff?',['Habe ich einen festen, wiederkehrenden Aufbau meiner Kanäle und Fader?','Finde ich wichtige Instrumente auch in hektischen Situationen sofort?','Habe ich meinen Workflow bewusst entwickelt oder hat er sich über die Jahre einfach ergeben?','Passe ich meine Arbeitsweise an unterschiedliche Besetzungen und Anforderungen an?'],'Ein durchdachter Workflow schafft Übersicht und lässt mehr Aufmerksamkeit für die Musik.'],
['Gainstruktur – stimmt mein Fundament?',['Kenne ich den Unterschied zwischen Gain und Fader?','Pegle ich meine Eingangssignale bewusst ein oder übernehme ich vorhandene Einstellungen?','Weiß ich, woran ich eine saubere Aussteuerung mit ausreichend Headroom erkenne?','Kenne ich die Auswirkungen einer Gainänderung auf die nachfolgende Signalbearbeitung und die Monitorwege?'],'Eine saubere Gainstruktur bildet das Fundament für einen kontrollierbaren Mix.'],
['Equalizer – weiß ich, was ich verändere?',['Nutze ich den EQ gezielt oder verändere ich Frequenzen nach Gefühl?','Weiß ich, welche Frequenzbereiche ich bearbeite und warum?','Nutze ich Hochpassfilter überhaupt – und wenn ja, sinnvoll?','Überprüfe ich, ob meine EQ-Einstellungen den Gesamtklang tatsächlich verbessern?'],'Nicht jede Frequenz muss bearbeitet werden. Entscheidend ist, was dem Gesamtklang hilft.'],
['Gate – bringe ich Ruhe in meinen Mix?',['Nutze ich Gates überhaupt – und wenn ja, mit welchem Ziel?','Weiß ich, wie ich unerwünschtes Übersprechen reduzieren kann?','Überprüfe ich, ob leise Einsätze oder ausklingende Töne abgeschnitten werden?','Hinterfrage ich vorhandene Gate-Einstellungen oder übernehme ich sie unverändert?'],'Ein sinnvoll eingesetztes Gate reduziert unerwünschte Signale, ohne das musikalische Spiel zu beeinträchtigen.'],
['Kompressor – brauche ich ihn wirklich?',['Nutze ich Kompressoren überhaupt – und wenn ja, warum?','Weiß ich, wie Threshold, Ratio, Attack und Release zusammenwirken?','Höre ich bewusst, ob die Kompression eine Verbesserung bringt?','Erkenne ich, wann ich besser auf Kompression verzichte?'],'Nicht jedes Signal benötigt einen Kompressor. Dynamik ist ein wichtiger Bestandteil der Musik.'],
['Subgruppen und DCAs – nutze ich meine Möglichkeiten?',['Kenne ich den Unterschied zwischen Subgruppen und DCAs?','Nutze ich diese Möglichkeiten überhaupt – und wenn ja, sinnvoll?','Habe ich mir Gedanken darüber gemacht, welche Instrumente sinnvoll zusammengehören?','Nutze ich Gruppen nur zur Vereinfachung der Bedienung oder auch zur gezielten Klanggestaltung?'],'Eine durchdachte Gruppenstruktur schafft Übersicht und ermöglicht gezielte Eingriffe in den Gesamtmix.'],
['Effekte – unterstützen sie wirklich die Musik?',['Nutze ich Hall und Delay bewusst oder lediglich aus Gewohnheit?','Weiß ich, welche Wirkung ich mit meinen Effekten erreichen möchte?','Passe ich meine Effekte an die Raumakustik und die musikalischen Anforderungen an?','Vergleiche ich bewusst, wie mein Mix mit und ohne Effekte klingt?'],'Effekte sollen die Musik unterstützen, nicht ihre Details verdecken.'],
['Musikverständnis und Tiefenstaffelung',['Kenne ich die musikalischen Aufgaben der einzelnen Instrumente?','Erkenne ich, welche Stimmen gerade im Vordergrund stehen sollten?','Mische ich einzelne Instrumente möglichst präsent oder achte ich auf das musikalische Gesamtbild?','Nutze ich Lautstärke, Frequenzverteilung und Räumlichkeit bewusst zur Klanggestaltung?'],'Ein guter Mix macht musikalische Zusammenhänge hörbar, statt alle Instrumente gleich stark in den Vordergrund zu stellen.'],
['Mikrofonierung – beginnt mein Mix an der richtigen Stelle?',['Weiß ich, warum ich ein bestimmtes Mikrofon für ein Instrument verwende?','Überprüfe ich die Mikrofonposition oder verlasse ich mich auf den gewohnten Aufbau?','Kenne ich die Auswirkungen unterschiedlicher Richtcharakteristiken?','Versuche ich Klangprobleme bereits an der Schallquelle zu lösen, bevor ich zum EQ greife?'],'Ein guter Klang beginnt vor dem Mischpult.'],
['Monitoring – was hören meine Musiker?',['Weiß ich, was auf den einzelnen Monitorwegen tatsächlich ankommt?','Kenne ich die Unterschiede zwischen Pre- und Post-Fader sowie Pre- und Post-EQ?','Weiß ich, welche Änderungen am FOH auch die Monitormischungen beeinflussen?','Überprüfe ich bestehende Monitormischungen oder verlasse ich mich auf bisherige Einstellungen?'],'Ein guter Monitormix unterstützt die Musiker beim Zusammenspiel und muss nicht wie der Saalmix klingen.'],
['Soundcheck – habe ich einen Plan?',['Habe ich einen festen, wiederkehrenden Ablauf für meinen Soundcheck?','Überprüfe ich Signalwege und Pegel systematisch?','Höre ich Instrumente auch im Zusammenspiel oder ausschließlich einzeln?','Weiß ich, welche Arbeitsschritte bei wenig Zeit Vorrang haben?'],'Ein strukturierter Soundcheck schafft Sicherheit und lässt mehr Zeit für den eigentlichen Mix.'],
['Zuhören und Selbstkontrolle – hinterfrage ich meine Arbeit?',['Höre ich meinen eigenen Mix regelmäßig kritisch an?','Hinterfrage ich Einstellungen und Arbeitsweisen, die ich seit Jahren verwende?','Kann ich konstruktive Rückmeldungen von Musikern oder anderen Technikern annehmen?','Bin ich bereit, neue Arbeitsweisen auszuprobieren und dazuzulernen?'],'Wer seinen Mix regelmäßig hinterfragt, schafft die Grundlage für Verbesserungen.']
];
const STORAGE_KEY='solls-klingen-soundcheck-v02';
let step=-1,name='',club='',answers=Array.from({length:12},()=>({level:'',workshop:''}));
let savedDraft=null;
try { const raw=localStorage.getItem(STORAGE_KEY);if(raw){const v=JSON.parse(raw);if(v&&Array.isArray(v.answers)&&v.answers.length===12){savedDraft=v;}} }catch(e){}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({step,name,club,answers,savedAt:new Date().toISOString()}))}catch(e){console.warn('Lokales Speichern nicht verfügbar',e)}}
function resume(){if(!savedDraft)return;({step,name,club,answers}=savedDraft);savedDraft=null;render()}
function fresh(){if(!confirm('Bisherigen Entwurf verwerfen und neu beginnen?'))return; savedDraft=null;step=-1;name='';club='';answers=Array.from({length:12},()=>({level:'',workshop:''}));save();render()}
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){if(step===-1){app.innerHTML=`<h1>Dein persönlicher Soundcheck</h1>${savedDraft?`<div class="note"><b>Gespeicherter Soundcheck gefunden</b><p class="small">Deine bisherigen Antworten sind auf diesem Gerät gespeichert.</p><div class="nav"><button id="resume">Fortsetzen →</button><button class="secondary" id="fresh">Neu beginnen</button></div></div>`:''}<p>12 Themen rund um das Mischen von Blasmusik. Keine Prüfung, sondern Denkanstöße zur eigenen Arbeitsweise.</p><p class="muted">Beschallungsaufbau und Systemeinmessung sind bewusst nicht Bestandteil dieses Selbstchecks.</p><label>Name <span class="muted">(optional)</span><input id="name" type="text" value="${esc(name)}" placeholder="Dein Name"></label><label>Musikverein / Kapelle <span class="muted">(optional)</span><input id="club" type="text" value="${esc(club)}" placeholder="Dein Verein"></label><p class="small muted">Bitte mindestens eines der beiden Felder ausfüllen. Die Angaben und Antworten bleiben in dieser Testversion auf deinem Gerät.</p><button id="start" ${name.trim()||club.trim()?'':'disabled'}>Soundcheck starten →</button>`;if(savedDraft){document.getElementById('resume').onclick=resume;document.getElementById('fresh').onclick=fresh;}document.getElementById('name').oninput=e=>{name=e.target.value;save();toggle()};document.getElementById('club').oninput=e=>{club=e.target.value;save();toggle()};document.getElementById('start').onclick=()=>{step=0;save();render()};return}if(step===12){let counts={Sicher:0,'Teilweise sicher':0,Unsicher:0};answers.forEach(a=>counts[a.level]++);app.innerHTML=`<h1>Dein Soundcheck</h1><p class="muted">${esc(name||'Ohne Namensangabe')} · ${esc(club||'Ohne Vereinsangabe')}</p><p><b>${counts.Sicher}</b> sicher · <b>${counts['Teilweise sicher']}</b> teilweise sicher · <b>${counts.Unsicher}</b> unsicher</p><h2>Deine Themen</h2>${topics.map((t,i)=>`<div class="result"><b>${i+1}. ${esc(t[0])}</b><br><span class="small">Kenntnisse: ${esc(answers[i].level)} · Workshop: ${answers[i].workshop==='Ja'?'Interesse':'Kein Interesse'}</span></div>`).join('')}<p class="small muted">Diese Auswertung basiert ausschließlich auf deiner Selbsteinschätzung. Sie ist keine Prüfung.</p><div class="nav no-print"><button class="secondary" id="back">← Zurück</button><button id="print">Als PDF speichern / Drucken</button></div><p class="small muted no-print">Ein Ergebnisversand ist in dieser ersten Version noch nicht eingerichtet. Es werden keine Antworten an den Ersteller übertragen.</p>`;document.getElementById('back').onclick=()=>{step=11;save();render()};document.getElementById('print').onclick=()=>window.print();return}const t=topics[step],a=answers[step];app.innerHTML=`<p class="muted small">Thema ${step+1} von 12</p><div class="progress"><div class="bar" style="width:${(step+1)/12*100}%"></div></div><h2>${esc(t[0])}</h2><p class="muted">Denkanstöße für deine Mischpraxis:</p>${t[1].map(q=>`<div class="question">${esc(q)}</div>`).join('')}<div class="note"><b>Merksatz</b><br>${esc(t[2])}</div><b>Wie schätzt du deine Kenntnisse ein?</b><div class="choices">${['Sicher','Teilweise sicher','Unsicher'].map(x=>`<label><input type="radio" name="level" value="${x}" ${a.level===x?'checked':''}> ${x}</label>`).join('')}</div><b>Möchtest du das Thema in einem Praxisworkshop vertiefen?</b><div class="choices">${['Ja','Nein'].map(x=>`<label><input type="radio" name="workshop" value="${x}" ${a.workshop===x?'checked':''}> ${x}</label>`).join('')}</div><div class="nav"><button class="secondary" id="back">← Zurück</button><button id="next" ${a.level&&a.workshop?'':'disabled'}>${step===11?'Auswertung ansehen':'Weiter →'}</button></div>`;document.querySelectorAll('input[name=level]').forEach(el=>el.onchange=e=>{a.level=e.target.value;save();toggle()});document.querySelectorAll('input[name=workshop]').forEach(el=>el.onchange=e=>{a.workshop=e.target.value;save();toggle()});document.getElementById('back').onclick=()=>{step--;save();render()};document.getElementById('next').onclick=()=>{step++;save();render()}}function toggle(){if(step===-1){document.getElementById('start').disabled=!(name.trim()||club.trim())}else if(step<12){document.getElementById('next').disabled=!(answers[step].level&&answers[step].workshop)}}render();
</script></body></html>
